[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sdlc-skill-library"
version = "1.0.0rc1"
description = "Deterministic helper CLI for the first-party, Markdown-first SDLC Skill library"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
sdlc = "sdlc.cli:main"
sdlc-install-claude-code = "sdlc.adapters:claude_code_main"
sdlc-install-codex = "sdlc.adapters:codex_main"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["sdlc"]

[tool.setuptools.package-data]
sdlc = ["templates/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures", ".git", "*.egg-info", ".venv"]
